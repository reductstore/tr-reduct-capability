name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - run: npm install

      - run: npm run lint

      - run: npm run fmt:check

      - run: npm audit --audit-level=high

      - run: npm test
